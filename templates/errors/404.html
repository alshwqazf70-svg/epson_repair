{% extends "base.html" %}
{% block title %}404 — الصفحة غير موجودة{% endblock %}
{% block content %}
<section class="card">
  <h1 class="section-title">404 — الصفحة غير موجودة</h1>
  <p>الرابط المطلوب غير موجود، أو أن المقالة حُذفت أو لم تُنشر بعد.</p>
  <form method="get" action="{{ url_for('public.search') }}" class="field">
    <label for="q404">ابحث في الموسوعة بدلاً من ذلك</label>
    <input type="search" id="q404" name="q" placeholder="مثال: ورق، خطوط، تغذية، USB">
    <div class="btn-row"><button class="btn btn-primary btn-sm" type="submit">بحث</button></div>
  </form>
  <div class="btn-row">
    <a class="btn" href="{{ url_for('public.faults') }}">كل الأعطال</a>
    <a class="btn" href="{{ url_for('public.models') }}">الموديلات</a>
    <a class="btn" href="{{ url_for('public.index') }}">الرئيسية</a>
  </div>
</section>
{% endblock %}
